name: Renovate

# Self-hosted Renovate. It reads .github/renovate.json and, per that config:
#   * opens PRs immediately only for security/vulnerability fixes, and
#   * lists every other available update on the Dependency Dashboard issue,
#     opening a PR only when you tick its checkbox (dependencyDashboardApproval).
# Runs on the existing cyoda-go-release-bot GitHub App token (RELEASE_APP_*),
# so no second app install is needed. See ai/npm-release-mechanism.md for the app.

on:
  schedule:
    # Mondays 07:00 UTC — refresh the dashboard, honour approvals, raise security PRs.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options:
          - info
          - debug

concurrency:
  group: renovate
  cancel-in-progress: false

# The job's own GITHUB_TOKEN only needs to check out the repo; all writes
# (branches, PRs, the dashboard issue) go through the App token below.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived App token so Renovate's PRs are authored by the app
      # (a non-GITHUB_TOKEN identity) and therefore trigger CI / Release Preflight
      # like a human PR — the same reason release.yml uses this app.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Renovate
        uses: renovatebot/github-action@b50d2ba2bd928235abdcc14d06dfafc217f1c565 # v46.1.18
        with:
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Restrict this self-hosted run to just this repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          # Config is committed at .github/renovate.json — skip the onboarding PR.
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
